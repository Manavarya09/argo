[workspace]
resolver = "2"
members = [
    "crates/argo",
    "crates/argo-theme",
    "crates/argo-pty",
    "crates/argo-terminal",
    "crates/argo-ui",
    "crates/argo-agent-registry",
    "crates/argo-auth-detector",
    "crates/argo-relay-v2",
    "crates/argo-yolo-router",
]
exclude = ["vendor/wezterm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Manav Arya Singh"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
portable-pty = "0.8"
alacritty_terminal = "0.24"
gpui = "0.2"
dirs = "5"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[workspace.metadata.bundle]
name = "Argo"
identifier = "dev.argo.app"
icon = ["assets/icon.icns"]
version = "0.1.0"
copyright = "Argo contributors"
category = "DeveloperTool"
short_description = "Every AI agent on one ship."
long_description = """
Argo is a native multi-agent terminal that auto-detects every AI coding agent
authenticated on your machine.
"""
