[workspace]
resolver = "2"
members = [
    "crates/argo",
    "crates/argo-theme",
    "crates/argo-pty",
    "crates/argo-terminal",
    "crates/argo-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Manav Arya Singh"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
portable-pty = "0.8"
alacritty_terminal = "0.24"
gpui = "0.2"
